[project]
name = "restart-time-backend"
version = "0.1.0"
description = "Trauma-informed AI agent for time management — backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "supabase>=2.4",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "structlog>=24.1",
    "PyJWT[crypto]>=2.8",
    "apscheduler>=3.10",
    "pywebpush>=2.0",
    "google-api-python-client>=2.120",
    "google-auth>=2.28",
    "google-auth-oauthlib>=1.2",
    "pynacl>=1.5",
    "PyYAML>=6.0",
    "rapidfuzz>=3.6",
    "faster-whisper>=1.0",
    # CUDA runtime deps for faster-whisper on Windows (matches the user's
    # transcription_service setup). Wheels exist on Windows + Linux.
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "httpx>=0.27",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
